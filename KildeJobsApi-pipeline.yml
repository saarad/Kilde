# .NET Core Function App to Windows on Azure
# Build a .NET Core function app and deploy it to Azure as a Windows function App.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/en-us/azure/devops/pipelines/languages/dotnet-core

resources:
 repositories:
   - repository: KildeWebAPI
     type: git
     name: Kilde/KildeWebAPI
     ref: main
     trigger: #trigger cron job build on dependency change
      - main

trigger:
- main

variables:
  # Azure Resource Manager connection created during pipeline creation
  azureSubscription: '8e3e0b28-8a05-4e8c-a934-cde8afd66696'


  # Agent VM image name
  vmImageName: 'windows-2019'

  # Working Directory
  workingDirectory: '$(Build.SourcesDirectory)/KildeCronJobs/KildeCronJobs/Kilde.JobsApi'

stages:
- stage: Build
  displayName: Build stage

  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)

    steps:
    - checkout: self
    - checkout: KildeWebAPI

    - script: dir $(Build.SourcesDirectory)
    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: 'build'
        projects: |
          $(workingDirectory)/*.csproj
        arguments: --output $(System.DefaultWorkingDirectory)/publish_output --configuration Release

    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/publish_output'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - publish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      artifact: drop